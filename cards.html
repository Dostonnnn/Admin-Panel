<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carts</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  </head>
  <body>
    <div class="box">
      <div class="sidebar">
        <h2 class="sidebar-title">Panel</h2>
        <div class="list">
          <ul>
            <li class="list-item"><a href="./main.html">Products</a></li>
            <li class="list-item"><a href="./users.html">Users</a></li>
            <li class="list-item active">Carts</li>
          </ul>
        </div>
      </div>

      <div class="main">
        <nav class="main-navbar">
          <h2 class="main-navbar-title">Dashboard Navbar</h2>
        </nav>

        <h2 class="main-title">Carts</h2>

        <div class="table-container">
          <table class="products-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Password</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody class="card-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="user-card display hidden">
        <table class="products-table additional">
          <thead>
            <tr>
              <th>ID</th>
              <th>Description</th>
              <th>Date</th>
              <th>Image</th>
              <th>Quantity</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody class="card-tbody2"></tbody>
        </table>
      </div>
    </div>

    <script src="./js/cards.js"></script>
  </body>
</html>
