<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
  </head>
  <body>
    <div class="box">
      <div class="sidebar">
        <h2 class="sidebar-title">Panel</h2>
        <div class="list">
          <ul>
            <li class="list-item"><a href="./main.html">Products</a></li>
            <li class="list-item active"><a href="./users.html">Users</a></li>
            <li class="list-item"><a href="./cards.html">Cards</a></li>
          </ul>
        </div>
      </div>

      <div class="main">
        <nav class="main-navbar">
          <h2 class="main-navbar-title">Dashboard Navbar</h2>
        </nav>

        <form action="" class="user-form">
          <input
            name="id"
            type="number"
            class="search-form-input id"
            placeholder="Enter user ID"
          />
          <input
            name="username"
            type="text"
            class="search-form-input username"
            placeholder="Enter the username"
          />
          <input
            name="email"
            type="email"
            class="search-form-input email"
            placeholder="Enter the email"
          />
          <input
            name="password"
            type="password"
            class="search-form-input password"
            placeholder="Enter the password"
          />
          <div class="btns add">
            <button type="reset" class="user-cancel">Cancel</button>
            <button type="submit" class="user-add">Add</button>
          </div>
        </form>

        <h2 class="main-title">Users</h2>

        <div class="user-container">
          <table class="user-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Password</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody class="tbody2"></tbody>
          </table>
        </div>
      </div>

      <div class="user-modal back"></div>

      <div class="user-edit-modal hidden">
        <form action="" class="user-edit-form">
          <input
            name="id2"
            type="number"
            class="search-form-input id"
            placeholder="Enter the ID"
          />
          <input
            name="username2"
            type="text"
            class="search-form-input username"
            placeholder="Enter username"
          />
          <input
            name="email2"
            type="email"
            class="search-form-input email"
            placeholder="Enter email"
          />
          <input
            name="password2"
            type="password"
            class="search-form-input password"
            placeholder="Enter password"
          />

          <div class="btns add">
            <button type="reset" class="user-btn-cancel2">Cancel</button>
            <button type="submit" class="user-btn-update2">Add</button>
          </div>
        </form>
      </div>
    </div>

    <script src="./js/users.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  </body>
</html>
